name: Build and Deploy convertoChat

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RAILS_ENV=production
            BUNDLE_WITHOUT=development:test

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GHCR_TOKEN,GHCR_USER,GHCR_IMAGE
          script_stop: true
          script: |
            set -e
            cd /root

            echo "=== [1/7] Backup do banco ==="
            docker compose exec -T postgres \
              pg_dump -U postgres chatwoot_production \
              > backup_pre_deploy_$(date +%Y%m%d_%H%M%S).sql
            echo "Backup concluido"

            echo "=== [2/7] Login no GHCR ==="
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo "=== [3/7] Pull da nova imagem ==="
            docker pull "$GHCR_IMAGE:latest"

            echo "=== [4/7] Parando containers ==="
            docker compose down

            echo "=== [5/7] Subindo com nova imagem ==="
            docker compose up -d

            echo "=== [6/7] Aguardando Rails iniciar (60s) ==="
            sleep 60

            echo "=== [7/8] Rodando migrations ==="
            docker compose exec -T rails bundle exec rails db:chatwoot_prepare || \
              docker compose exec -T rails bundle exec rails db:migrate

            echo "=== [8/8] Aplicando branding convertoChat ==="
            docker compose exec -T rails bundle exec rails runner '
              configs = {
                "INSTALLATION_NAME" => "convertoChat",
                "BRAND_NAME" => "convertoChat",
                "LOGO" => "/chat.png",
                "LOGO_DARK" => "/chat.png",
                "LOGO_THUMBNAIL" => "/chat.png",
                "BRAND_URL" => "https://www.convertochat.com",
                "WIDGET_BRAND_URL" => "https://www.convertochat.com",
                "INSTALLATION_PRICING_PLAN" => "enterprise"
              }
              configs.each do |name, value|
                c = InstallationConfig.find_or_initialize_by(name: name)
                c.update!(value: value)
                puts "  #{name} = #{value}"
              end
            '

            echo "=== Deploy concluido! ==="

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /root
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 http://localhost:3000)
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "Health check OK (HTTP $HTTP_CODE)"

              BODY=$(curl -s --max-time 10 http://localhost:3000)
              VERSION=$(echo "$BODY" | grep -o 'appVersion":"[^"]*"' || echo "unknown")
              echo "Version: $VERSION"

              BRAND=$(docker compose exec -T rails bundle exec rails runner 'puts InstallationConfig.find_by(name: "BRAND_NAME")&.value' 2>/dev/null || echo "unknown")
              echo "Brand: $BRAND"

              if echo "$BRAND" | grep -qi "convertoChat"; then
                echo "Branding OK: convertoChat"
              else
                echo "WARN: Branding pode nao estar aplicado ($BRAND)"
              fi
            else
              echo "Health check FAILED (HTTP $HTTP_CODE)"
              echo "Logs:"
              docker compose logs rails --tail 30
              exit 1
            fi
